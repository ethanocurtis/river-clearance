services:
  river-clearance-api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787" # bind to localhost; a reverse proxy on the host reaches it here.
                               # Using Nginx Proxy Manager (itself in Docker)? See "Nginx Proxy
                               # Manager" in README.md — you'll likely comment this out and use
                               # the shared-network block below instead, so NPM reaches this
                               # container directly without anything published to the host.
    environment:
      - PORT=8787
      - DB_PATH=/data/sync.sqlite3
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      # Set to /repo/docs to also serve the static docs/ folder from this same
      # container (same-origin frontend + API, no CORS). Leave unset/empty
      # for an API-only deployment. See "Serving the whole site from this
      # container" in README.md.
      - STATIC_DIR=${STATIC_DIR:-}
      - DATA_DIR=${DATA_DIR:-}
      # Required for email verification/reset links to work -- your real
      # public URL, no trailing slash.
      - APP_BASE_URL=${APP_BASE_URL:-}
      # Comma-separated emails that get the admin role automatically on signup.
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      # Auto-commit + push admin data edits back to GitHub -- both required
      # to enable it, see "Auto-committing admin edits to GitHub" in
      # README.md. Leave both unset for file-only admin saves (no git).
      - REPO_DIR=${REPO_DIR:-}
      - GIT_PUSH_TOKEN=${GIT_PUSH_TOKEN:-}
      - GIT_COMMIT_NAME=${GIT_COMMIT_NAME:-River Clearance Admin}
      - GIT_COMMIT_EMAIL=${GIT_COMMIT_EMAIL:-}
    volumes:
      - river-clearance-data:/data
      # Bind-mounts the WHOLE repo (not just docs/) read-write, at /repo --
      # needed so gitSync.js can run real git commands (add/commit/push)
      # against your actual working tree. `git pull` on the host still
      # updates the live site immediately with no rebuild needed for
      # content-only changes. Set STATIC_DIR=/repo/docs above to serve the
      # site from this same container; set REPO_DIR=/repo + GIT_PUSH_TOKEN
      # above to enable admin auto-push. If you'd rather the container not
      # be able to touch your git working directory at all, remove this
      # mount and leave STATIC_DIR/DATA_DIR/REPO_DIR unset -- the site then
      # needs to be served/hosted separately, and admin data editing/git
      # sync are both disabled (501) rather than breaking anything else.
      - ..:/repo
    # --- Nginx Proxy Manager users: uncomment both blocks below, replace
    # NPM_NETWORK_NAME with the actual network name (`docker network ls`),
    # and you can drop the `ports:` block above entirely -- NPM will reach
    # this service by its name ("river-clearance-api") on port 8787 over the
    # shared network. See README.md for the matching NPM UI steps.
    # networks:
    #   - default
    #   - npm_proxy

volumes:
  river-clearance-data:

